name: CI

on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # package runs the build's --check first, then vsce, which also validates the README badges.
      - run: npm test
      # Syntax colours against tools/regression/expected.json (downloads the pinned engine and grammars).
      - run: npm run regression
      - run: npm run package
